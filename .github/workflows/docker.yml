# Third-party Docker actions: separate ToS, privacy, and support.
name: Docker Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-package-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate release candidate
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push-image:
    name: Publish GHCR image
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=R20 Quantum Trader
            org.opencontainers.image.description=R20 Quantum Trading System
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Record immutable deployment target
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            printf 'Revision: `%s`\n\n' "$GITHUB_SHA"
            printf 'Image: `%s/%s@%s`\n\n' "$REGISTRY" "$IMAGE_NAME" "$IMAGE_DIGEST"
            printf 'Linux Docker host (existing Compose directory):\n\n'
            printf '```bash\npython3 deploy/update_docker.py update --image %s/%s@%s\n```\n' "$REGISTRY" "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
