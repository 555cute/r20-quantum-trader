name: r20-quantum-trader

services:
  r20:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        R20_BUILD_REVISION: ${R20_BUILD_REVISION:-local-build}
    image: r20-quantum-trader:${R20_IMAGE_TAG:-local}
    container_name: r20-quantum-trader
    restart: unless-stopped
    ports:
      - "${R20_HTTP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      R20_ENV_FILE: /app/config/.env
      R20_DEPLOYMENT_MODE: docker
      R20_GATEWAY_MODE: embedded
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8080"
    volumes:
      - ./docker/config:/app/config
      - r20_data:/app/data
      - r20_logs:/app/logs
      - r20_backups:/app/backups
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  r20_data:
  r20_logs:
  r20_backups:
