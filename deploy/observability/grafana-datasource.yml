# Grafana 数据源自动配置（与 docker-compose.yml 配套）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # 抓取间隔与 prometheus.yml 的 scrape_interval 保持一致
      timeInterval: 30s
      httpMethod: POST
