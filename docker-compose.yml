services:
  r20-quantum-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r20-quantum-trader
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 凭证与个性化配置统一走 .env（先 cp env.example .env 再填值）。
    # 后端 lifespan 会自动拉起并守护 r20_gateway.worker 调度子进程
    # （15 分钟交易循环 / 60 秒因子 / 10 分钟快讯 / 晨报晚报 / 20:00 自进化 / 02:00 灾备），
    # 无需额外跑调度容器。
    env_file:
      - .env
    environment:
      - PORT=8080
      # OKX 环境总开关：demo=模拟盘（默认，安全）。改实盘前务必确认凭证与风险。
      - R20_OKX_ENV=demo
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
