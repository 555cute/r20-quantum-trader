services:
  r20-quantum-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r20-quantum-trader
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      R20_OKX_ENV: ${R20_OKX_ENV:-demo}
      R20_GATEWAY_WORKER_ENABLED: ${R20_GATEWAY_WORKER_ENABLED:-1}
      R20_DASHBOARD_WORKER_ENABLED: ${R20_DASHBOARD_WORKER_ENABLED:-1}
      R20_MANUAL_CLOSE_ENABLED: ${R20_MANUAL_CLOSE_ENABLED:-0}
      # Host .env is bootstrap only; persist admin-saved settings on the data volume.
      R20_ENV_FILE: /app/data/config/.env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
