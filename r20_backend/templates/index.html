<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstraQuant - Loading</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #080B10;
      color: #EAECEF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 117, 246, 0.2);
      border-top-color: #3875F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      color: #707E94;
      font-size: 14px;
    }
  </style>
  <script>
    // 自动重定向到 Vue SPA 现代化终端
    window.location.replace('/');
  </script>
</head>
<body>
  <div class="loader"></div>
  <h2>AstraQuant</h2>
  <p>正在载入 Vue 3 现代化量化终端...</p>
</body>
</html>
